name: Build ModihMusic APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$ZIP_FILE"
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          if [ -f extracted/settings.gradle.kts ] || [ -f extracted/settings.gradle ]; then
            cp -r extracted/. .
          else
            PROJECT_DIR="$(find extracted -mindepth 1 -maxdepth 1 -type d -print -quit)"
            test -n "$PROJECT_DIR"
            cp -r "$PROJECT_DIR"/. .
          fi
          rm -rf extracted

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ModihMusic-debug
          path: app/build/outputs/apk/debug/*.apk

# Auto-build trigger verification
